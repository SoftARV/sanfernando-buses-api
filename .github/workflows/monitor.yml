name: Production arrivals monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-arrivals-monitor
  cancel-in-progress: false

jobs:
  arrivals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:monitor
      - name: Check production arrivals
        run: npm run monitor
